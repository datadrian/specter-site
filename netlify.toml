[build]
  publish = "public"
  functions = "netlify/functions"
  command = "npm install"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/firmware/node/*.bin"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/firmware/node/latest.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache, max-age=0"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/help"
  to = "/help/index.html"
  status = 200

[[redirects]]
  from = "/download"
  to = "/download.html"
  status = 200

[[redirects]]
  from = "/download/"
  to = "/download.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/support/"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/license"
  to = "/help/index.html"
  status = 200

[[redirects]]
  from = "/licence"
  to = "/help/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[functions."outreach-scheduled"]
  schedule = "@weekly"
