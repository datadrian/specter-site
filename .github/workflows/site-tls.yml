name: Maintain site TLS
on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: specter-imaging-tls
  cancel-in-progress: false
jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Renew Imaging only within 30 days of expiry
        env:
          CLOUDFLARE_API_TOKEN_3: ${{ secrets.SPECTER_TLS_CLOUDFLARE_TOKEN }}
          NETLIFY_ACCESS_TOKEN: ${{ secrets.SPECTER_TLS_NETLIFY_TOKEN }}
        run: python scripts/renew-imaging-tls.py
      - name: Verify both sites and their www aliases
        run: |
          python - <<'PY'
          import ssl,socket,urllib.request,time
          hosts=['specter-imaging.com','www.specter-imaging.com','specter-sdr.com','www.specter-sdr.com']
          for host in hosts:
            for attempt in range(10):
              try:
                with socket.create_connection((host,443),timeout=20) as raw:
                  with ssl.create_default_context().wrap_socket(raw,server_hostname=host) as sock:
                    cert=sock.getpeercert()
                    days=(ssl.cert_time_to_seconds(cert['notAfter'])-time.time())/86400
                    if days<14:raise RuntimeError('TLS certificate expires in less than 14 days')
                response=urllib.request.urlopen('https://'+host,timeout=30)
                assert response.status==200
                print(host,cert['notAfter'],response.status)
                break
              except Exception:
                if attempt==9:raise
                time.sleep(30)
          PY
