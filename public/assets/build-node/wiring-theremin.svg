<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1120" role="img" aria-label="Complete SPECTER Node resistor sensor wiring diagram. GPIO18 drives through a 1 megaohm resistor to the GPIO4 antenna sense node. The antenna connects through an optional 10 kiloohm protection resistor. The diagram also shows the QMC5883L on GPIO21 and GPIO22, LED ring on GPIO13, buzzer on GPIO12, and optional power capacitor.">
<defs><style>
.bg{fill:#070a0f}.panel{fill:#0c1219;stroke:#263945;stroke-width:2}.board{fill:#111a22;stroke:#b9d8e6;stroke-width:3}.part{fill:#141e27;stroke:#5f7f8e;stroke-width:2}.rail{stroke:#718896;stroke-width:5;fill:none}.sig{stroke:#00e5ff;stroke-width:6;fill:none}.pwr{stroke:#ffca5c;stroke-width:5;fill:none}.gnd{stroke:#8aa0aa;stroke-width:5;fill:none}.led{stroke:#ff5c9a;stroke-width:5;fill:none}.mag{stroke:#78e08f;stroke-width:5;fill:none}.txt{fill:#dce8ee;font:22px Arial,sans-serif}.small{fill:#9fb4be;font:18px Arial,sans-serif}.tiny{fill:#8399a3;font:16px Arial,sans-serif}.head{fill:#00e5ff;font:bold 25px Arial,sans-serif}.title{fill:#eaf7fb;font:bold 34px Arial,sans-serif}.sub{fill:#9fb4be;font:20px Arial,sans-serif}.pin{fill:#00e5ff;font:bold 19px monospace}.label{fill:#eaf7fb;font:bold 20px Arial,sans-serif}.res{fill:#d6b36b;stroke:#f4d58d;stroke-width:2}.node{fill:#00e5ff}.warn{fill:#ffca5c;font:bold 17px Arial,sans-serif}.ok{fill:#78e08f;font:bold 18px Arial,sans-serif}
</style></defs>
<rect class="bg" width="1600" height="1120"/>
<text class="title" x="40" y="52">SPECTER NODE // TWO-PIN RESISTOR SENSOR + COMPLETE NODE WIRING</text>
<text class="sub" x="40" y="84">No logic chip required. GPIO18 charges the antenna node through 1MΩ while GPIO4 measures charge time.</text>

<!-- RC sensor panel -->
<rect class="panel" x="35" y="115" width="625" height="515" rx="12"/>
<text class="head" x="65" y="158">A. EXTENDED-RANGE RESISTOR SENSOR</text>
<text class="small" x="65" y="190">Fixed firmware mode: GPIO18 drive, GPIO4 sense</text>

<!-- antenna -->
<line class="rail" x1="120" y1="245" x2="120" y2="430"/>
<line class="rail" x1="102" y1="245" x2="138" y2="245"/>
<line class="rail" x1="108" y1="220" x2="132" y2="220"/>
<line class="rail" x1="114" y1="195" x2="126" y2="195"/>
<text class="label" x="62" y="470">TELESCOPIC</text><text class="label" x="83" y="496">ANTENNA</text>

<!-- optional 10k -->
<path class="sig" d="M120 430 H180"/>
<rect class="res" x="180" y="412" width="150" height="36" rx="7"/>
<text class="label" x="255" y="437" text-anchor="middle">10kΩ OPTIONAL</text>
<path class="sig" d="M330 430 H470"/>
<circle class="node" cx="470" cy="430" r="10"/>
<text class="pin" x="470" y="468" text-anchor="middle">SENSE NODE</text>

<!-- 1M drive -->
<path class="sig" d="M625 280 H555"/>
<rect class="res" x="405" y="262" width="150" height="36" rx="7"/>
<text class="label" x="480" y="287" text-anchor="middle">1MΩ REQUIRED</text>
<path class="sig" d="M405 280 H370 V430 H470"/>
<text class="small" x="392" y="244">charge path</text>

<!-- sense path -->
<path class="sig" d="M470 430 H575 V360 H625"/>
<text class="small" x="482" y="402">measure</text>

<rect class="part" x="70" y="535" width="550" height="62" rx="8"/>
<text class="ok" x="90" y="562">WIRING</text>
<text class="small" x="190" y="562">GPIO18 → 1MΩ → sense node → GPIO4</text>
<text class="small" x="190" y="586">Antenna → optional 10kΩ → same sense node</text>

<!-- ESP32 -->
<rect class="board" x="625" y="115" width="500" height="690" rx="18"/>
<text class="head" x="875" y="160" text-anchor="middle">ESP32 DEV BOARD</text>
<rect x="790" y="190" width="170" height="305" rx="16" fill="#1b2933" stroke="#5f7f8e" stroke-width="2"/>
<rect x="820" y="220" width="110" height="155" rx="7" fill="#203847" stroke="#87a7b5"/>
<path d="M800 400 H950 M800 425 H950 M800 450 H950" stroke="#45616f" stroke-width="3"/>
<text class="small" x="875" y="525" text-anchor="middle">USB POWER / DATA</text>

<!-- left board pins -->
<circle class="node" cx="625" cy="280" r="7"/><text class="pin" x="645" y="286">GPIO18 DRIVE</text>
<circle class="node" cx="625" cy="360" r="7"/><text class="pin" x="645" y="366">GPIO4 SENSE</text>
<circle cx="625" cy="535" r="7" fill="#78e08f"/><text class="pin" x="645" y="541">GPIO21 SDA</text>
<circle cx="625" cy="590" r="7" fill="#78e08f"/><text class="pin" x="645" y="596">GPIO22 SCL</text>
<circle cx="625" cy="680" r="7" fill="#ffca5c"/><text class="pin" x="645" y="686">3.3V</text>
<circle cx="625" cy="735" r="7" fill="#8aa0aa"/><text class="pin" x="645" y="741">GND</text>

<!-- right board pins -->
<circle cx="1125" cy="300" r="7" fill="#ff5c9a"/><text class="pin" x="1105" y="306" text-anchor="end">GPIO13 LED DATA</text>
<circle cx="1125" cy="500" r="7" fill="#00e5ff"/><text class="pin" x="1105" y="506" text-anchor="end">GPIO12 BUZZER</text>
<circle cx="1125" cy="680" r="7" fill="#ffca5c"/><text class="pin" x="1105" y="686" text-anchor="end">3.3V</text>
<circle cx="1125" cy="735" r="7" fill="#8aa0aa"/><text class="pin" x="1105" y="741" text-anchor="end">GND</text>

<!-- QMC panel -->
<rect class="panel" x="35" y="665" width="540" height="405" rx="12"/>
<text class="head" x="65" y="708">B. QMC5883L MAGNETOMETER</text>
<rect class="part" x="90" y="765" width="270" height="210" rx="12"/>
<text class="label" x="225" y="805" text-anchor="middle">QMC5883L / GY-271</text>
<circle cx="125" cy="850" r="7" fill="#ffca5c"/><text class="pin" x="145" y="856">VCC</text>
<circle cx="125" cy="900" r="7" fill="#8aa0aa"/><text class="pin" x="145" y="906">GND</text>
<circle cx="325" cy="850" r="7" fill="#78e08f"/><text class="pin" x="305" y="856" text-anchor="end">SDA</text>
<circle cx="325" cy="900" r="7" fill="#78e08f"/><text class="pin" x="305" y="906" text-anchor="end">SCL</text>
<path class="mag" d="M325 850 H500 V535 H625"/>
<path class="mag" d="M325 900 H530 V590 H625"/>
<path class="pwr" d="M125 850 H65 V680 H625"/>
<path class="gnd" d="M125 900 H55 V735 H625"/>
<text class="small" x="90" y="1020">Use the module labels, not assumed pin order.</text>
<text class="small" x="90" y="1047">Supported addresses: 0x0D and 0x2C.</text>

<!-- LED ring -->
<rect class="panel" x="1160" y="115" width="405" height="330" rx="12"/>
<text class="head" x="1190" y="158">C. LED RING</text>
<circle cx="1360" cy="275" r="92" fill="none" stroke="#334955" stroke-width="22"/>
<circle cx="1360" cy="183" r="8" fill="#ff5c9a"/><circle cx="1425" cy="210" r="8" fill="#ff5c9a"/><circle cx="1452" cy="275" r="8" fill="#ff5c9a"/><circle cx="1425" cy="340" r="8" fill="#ff5c9a"/><circle cx="1360" cy="367" r="8" fill="#ff5c9a"/><circle cx="1295" cy="340" r="8" fill="#ff5c9a"/><circle cx="1268" cy="275" r="8" fill="#ff5c9a"/><circle cx="1295" cy="210" r="8" fill="#ff5c9a"/>
<path class="led" d="M1125 300 H1215"/><text class="small" x="1230" y="306">DIN</text>
<text class="small" x="1190" y="408">DIN GPIO13 · VCC 3.3V or 5V · GND common</text>

<!-- buzzer -->
<rect class="panel" x="1160" y="475" width="405" height="205" rx="12"/>
<text class="head" x="1190" y="518">D. PASSIVE BUZZER</text>
<circle cx="1370" cy="590" r="55" fill="#18242d" stroke="#00e5ff" stroke-width="3"/>
<path class="sig" d="M1125 500 H1240 V575 H1315"/>
<text class="label" x="1370" y="598" text-anchor="middle">+</text>
<text class="small" x="1190" y="653">Positive GPIO12 · Negative GND</text>

<!-- power filter -->
<rect class="panel" x="1160" y="715" width="405" height="355" rx="12"/>
<text class="head" x="1190" y="758">E. POWER + OPTIONAL CAPACITOR</text>
<path class="pwr" d="M1125 680 H1515 V815"/>
<path class="gnd" d="M1125 735 H1480 V955"/>
<line x1="1380" y1="845" x2="1450" y2="845" stroke="#ffca5c" stroke-width="8"/>
<line x1="1380" y1="875" x2="1450" y2="875" stroke="#8aa0aa" stroke-width="4"/>
<path class="pwr" d="M1415 815 V845"/><path class="gnd" d="M1415 875 V955"/>
<text class="label" x="1260" y="850">100µF / 35V</text>
<text class="small" x="1190" y="905">Positive to 3.3V</text><text class="small" x="1190" y="933">Negative stripe to GND</text>
<text class="warn" x="1190" y="1005">Power off before moving any wire.</text>

<!-- legend -->
<rect class="part" x="625" y="845" width="500" height="225" rx="12"/>
<text class="head" x="655" y="888">FIRMWARE SETTING</text>
<text class="txt" x="655" y="928">Settings → Sense source:</text>
<text class="label" x="655" y="963">Extended-range resistor sensor</text>
<text class="small" x="655" y="997">GPIO18 drive through 1MΩ to GPIO4 sense</text>
<text class="tiny" x="655" y="1030">Portal shows live charge time, baseline, and wiring status.</text>
</svg>
