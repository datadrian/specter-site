<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 800" role="img" aria-label="SPECTER Node extended-range antenna oscillator wiring diagram using only a 74HC00 NAND chip, resistors, antenna capacitance, and a 100 microfarad supply capacitor. Three NAND gates form the oscillator and the fourth buffers its output to ESP32 GPIO14.">
<defs><style>
.bg{fill:#070a0f}.box{fill:#0d1520;stroke:#263744;stroke-width:2}.ic{fill:#111a22;stroke:#b98cff;stroke-width:2}.title{fill:#00e5ff;font:700 18px monospace;letter-spacing:2px}.sub{fill:#8596a3;font:13px monospace}.head{fill:#e9f1f5;font:700 16px monospace}.txt{fill:#c7d2da;font:13px monospace}.dim{fill:#80909c;font:12px monospace}.pin{fill:#00e5ff;font:700 13px monospace}.sig{fill:none;stroke:#00e5ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.osc{fill:none;stroke:#b98cff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.pwr{fill:none;stroke:#ff5d5d;stroke-width:3;stroke-linecap:round}.gnd{fill:none;stroke:#8a97a3;stroke-width:3;stroke-linecap:round}.dot{fill:#b98cff}.warn{fill:#ffd166;font:700 12px monospace}.gate{fill:#121d26;stroke:#b98cff;stroke-width:1.5}.n{fill:#b98cff;font:700 12px monospace}.note{fill:#0b1118;stroke:#00e5ff;stroke-opacity:.5;stroke-width:1.5}.r{fill:none;stroke:#e9f1f5;stroke-width:2}.rail{stroke-width:4}
</style></defs>
<rect class="bg" width="1230" height="800"/>
<path d="M18 18h30M18 18v30M1212 18h-30M1212 18v30M18 782h30M18 782v-30M1212 782h-30M1212 782v-30" fill="none" stroke="#26404c"/>
<text class="title" x="38" y="48">SPECTER NODE // 74HC00 ANTENNA OSCILLATOR</text>
<text class="sub" x="38" y="72">No transistor. No inductors. Three NAND gates oscillate; gate 4 buffers the signal into fixed ESP32 GPIO14.</text>

<rect class="box" x="35" y="100" width="720" height="555" rx="8"/>
<text class="head" x="58" y="132">74HC00 DIP-14, POWERED AT 3.3V</text>
<text class="dim" x="58" y="153">Tie both inputs of each NAND gate together so each gate behaves as an inverter.</text>

<!-- antenna node -->
<line class="osc" x1="90" y1="195" x2="90" y2="260"/>
<path class="osc" d="M72 195h36M78 185h24M84 175h12"/>
<circle class="dot" cx="90" cy="260" r="5"/>
<text class="pin" x="58" y="284">ANTENNA NODE A</text>
<text class="dim" x="58" y="303">Telescopic rod directly to pins 1 + 2</text>
<text class="dim" x="58" y="320">Its natural capacitance is the timing C</text>

<!-- gates -->
<rect class="gate" x="185" y="215" width="125" height="92" rx="7"/>
<text class="head" x="247" y="243" text-anchor="middle">GATE 1</text><text class="pin" x="198" y="268">1 + 2 IN</text><text class="pin" x="245" y="293">3 OUT</text>
<rect class="gate" x="365" y="215" width="125" height="92" rx="7"/>
<text class="head" x="427" y="243" text-anchor="middle">GATE 2</text><text class="pin" x="378" y="268">4 + 5 IN</text><text class="pin" x="425" y="293">6 OUT</text>
<rect class="gate" x="545" y="215" width="125" height="92" rx="7"/>
<text class="head" x="607" y="243" text-anchor="middle">GATE 3</text><text class="pin" x="558" y="268">9 + 10 IN</text><text class="pin" x="598" y="293">8 OUT</text>
<path class="osc" d="M90 260H185M310 260H365M490 260H545"/>

<!-- feedback resistor -->
<path class="osc" d="M670 260H705V365H635"/>
<path class="r" d="M635 365l-10 -9 -16 18 -16 -18 -16 18 -16 -18 -16 18 -10 -9"/>
<path class="osc" d="M565 365H90V260"/>
<text class="head" x="600" y="345" text-anchor="middle">R1 = 1MΩ</text>
<text class="dim" x="600" y="394" text-anchor="middle">Gate 3 output back to antenna node A</text>

<!-- gate4 buffer -->
<rect class="gate" x="365" y="430" width="190" height="100" rx="7"/>
<text class="head" x="460" y="458" text-anchor="middle">GATE 4, OUTPUT BUFFER</text>
<text class="pin" x="385" y="485">pins 12 + 13 IN</text><text class="pin" x="438" y="514">pin 11 OUT</text>
<path class="osc" d="M705 260V480H555"/>
<text class="dim" x="570" y="468">from pin 8</text>

<!-- power and cap -->
<path class="pwr rail" d="M70 590H705"/><text x="70" y="580" fill="#ff5d5d" font-family="monospace" font-weight="bold">3.3V RAIL</text>
<path class="gnd rail" d="M70 625H705"/><text x="70" y="648" fill="#8a97a3" font-family="monospace" font-weight="bold">GND RAIL</text>
<path class="pwr" d="M280 590V555"/><text class="pin" x="246" y="548">pin 14 VCC</text>
<path class="gnd" d="M345 625V555"/><text class="pin" x="320" y="548">pin 7 GND</text>
<line class="pwr" x1="600" y1="590" x2="600" y2="602"/><line class="gnd" x1="600" y1="613" x2="600" y2="625"/>
<line x1="580" y1="602" x2="620" y2="602" stroke="#e9f1f5" stroke-width="3"/><path d="M580 613q20 -8 40 0" fill="none" stroke="#e9f1f5" stroke-width="3"/>
<text class="txt" x="630" y="606">100µF / 35V electrolytic</text><text class="warn" x="630" y="624">+ to 3.3V, - to GND</text>

<!-- ESP32 -->
<rect class="box" x="800" y="115" width="390" height="390" rx="8"/>
<text class="head" x="825" y="148">ESP32 WROOM DEVKIT</text>
<rect class="ic" x="880" y="180" width="220" height="260" rx="10"/>
<text class="head" x="990" y="215" text-anchor="middle">ESP32</text>
<text class="pin" x="900" y="272">GPIO14, OSC IN</text>
<text class="pin" x="900" y="337">3V3</text><text class="pin" x="900" y="382">GND</text>

<!-- output resistor and connection -->
<path class="sig" d="M460 530V555H780V270H880"/>
<path class="r" d="M690 555l10 -9 16 18 16 -18 16 18 16 -18 10 9"/>
<text class="head" x="732" y="535" text-anchor="middle">R2 4.7kΩ</text>
<text class="dim" x="732" y="586" text-anchor="middle">pin 11 to GPIO14</text>
<path class="pwr" d="M990 337V590H705"/><path class="gnd" d="M1020 382V625H705"/>

<!-- standard peripherals -->
<rect class="note" x="800" y="535" width="390" height="120" rx="7"/>
<text class="head" x="820" y="565">OTHER NODE CONNECTIONS STAY THE SAME</text>
<text class="txt" x="820" y="590">QMC5883L: SDA GPIO21, SCL GPIO22</text>
<text class="txt" x="820" y="615">LED ring DIN: GPIO13</text>
<text class="txt" x="820" y="640">Passive buzzer +: GPIO12</text>

<rect class="note" x="35" y="680" width="1155" height="82" rx="7"/>
<text class="head" x="58" y="710">IMPORTANT</text>
<text class="txt" x="58" y="734">Do not connect the 100µF capacitor to the antenna node. If you have a small ceramic marked 104, add it across pins 14 and 7 for cleaner power.</text>
<text class="txt" x="58" y="752">Firmware: Settings &gt; Sense source &gt; Extended-range 74HC00 antenna oscillator. GPIO14 is fixed in oscillator mode.</text>
</svg>