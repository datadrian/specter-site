<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Share Tech Mono',monospace" role="img" aria-label="SPECTER Node basic build wiring diagram: ESP32 with a telescopic antenna wire on GPIO4 for capacitive touch proximity sensing, a QMC5883L magnetometer on I2C GPIO21 SDA and GPIO22 SCL, a WS2812B LED ring data line on GPIO13, and a passive buzzer on GPIO12, all powered from 3V3 and GND.">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1520"/><stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <style>
      .pin{fill:#0a0f16;stroke:#2a3a44;stroke-width:1.2}
      .pin.used{stroke:#00e5ff}
      .pinlbl{fill:#5a6b78;font-size:11px}
      .pinlbl.used{fill:#00e5ff;font-weight:bold}
      .comp{fill:#0d1520;stroke:#00e5ff;stroke-opacity:.55;stroke-width:1.4}
      .complbl{fill:#e4ecf2;font-size:13px;font-weight:bold}
      .compsub{fill:#7a8a96;font-size:10px}
      .wire{fill:none;stroke-width:2.6;stroke-linecap:round}
      .w-sig{stroke:#00e5ff}
      .w-3v3{stroke:#ff5d5d}
      .w-gnd{stroke:#8a97a3}
      .wlbl{font-size:10.5px;fill:#b8c6d0}
      .title{fill:#00e5ff;font-size:15px;letter-spacing:.16em}
      .subtitle{fill:#7a8a96;font-size:11px;letter-spacing:.08em}
      .term{fill:#00e5ff}
      .term3{fill:#ff5d5d}
      .termg{fill:#8a97a3}
      .brk{stroke:#00e5ff;stroke-opacity:.4;stroke-width:1;fill:none}
      .legend text{font-size:10.5px;fill:#b8c6d0}
    </style>
  </defs>

  <path class="brk" d="M14 14 h28 M14 14 v28"/>
  <path class="brk" d="M946 14 h-28 M946 14 v28"/>
  <path class="brk" d="M14 666 h28 M14 666 v-28"/>
  <path class="brk" d="M946 666 h-28 M946 666 v-28"/>
  <text class="title" x="34" y="42">SPECTER NODE // WIRING &#8212; BASIC BUILD</text>
  <text class="subtitle" x="34" y="60">touchRead antenna &#183; ~15cm range &#183; no extra chip</text>

  <!-- ESP32 board -->
  <rect x="400" y="160" width="160" height="360" rx="10" fill="url(#board)" stroke="#00e5ff" stroke-opacity=".65"/>
  <rect x="440" y="128" width="80" height="32" rx="3" fill="#12202b" stroke="#2a3a44"/>
  <text x="480" y="149" text-anchor="middle" fill="#7a8a96" font-size="9.5">USB-C</text>
  <text x="480" y="220" text-anchor="middle" fill="#e4ecf2" font-size="16" font-weight="bold">ESP32</text>
  <text x="480" y="238" text-anchor="middle" fill="#7a8a96" font-size="9.5">WROOM DEVKIT</text>
  <rect x="450" y="260" width="60" height="180" rx="3" fill="#060a0e" stroke="#1c2a33"/>

  <!-- LEFT PINS -->
  <rect class="pin used" x="392" y="252" width="12" height="12"/><text class="pinlbl used" x="386" y="262" text-anchor="end">3V3</text>
  <rect class="pin used" x="392" y="284" width="12" height="12"/><text class="pinlbl used" x="386" y="294" text-anchor="end">GND</text>
  <rect class="pin used" x="392" y="316" width="12" height="12"/><text class="pinlbl used" x="386" y="326" text-anchor="end">GPIO4 (T0)</text>
  <rect class="pin used" x="392" y="348" width="12" height="12"/><text class="pinlbl used" x="386" y="358" text-anchor="end">GPIO12</text>
  <rect class="pin used" x="392" y="380" width="12" height="12"/><text class="pinlbl used" x="386" y="390" text-anchor="end">GPIO13</text>
  <rect class="pin" x="392" y="412" width="12" height="12"/><text class="pinlbl" x="386" y="422" text-anchor="end">GPIO14</text>
  <rect class="pin" x="392" y="444" width="12" height="12"/><text class="pinlbl" x="386" y="454" text-anchor="end">GPIO27</text>

  <!-- RIGHT PINS -->
  <rect class="pin used" x="556" y="316" width="12" height="12"/><text class="pinlbl used" x="574" y="326">GPIO21 (SDA)</text>
  <rect class="pin used" x="556" y="348" width="12" height="12"/><text class="pinlbl used" x="574" y="358">GPIO22 (SCL)</text>
  <rect class="pin" x="556" y="380" width="12" height="12"/><text class="pinlbl" x="574" y="390">GND</text>
  <rect class="pin" x="556" y="412" width="12" height="12"/><text class="pinlbl" x="574" y="422">5V (VIN)</text>

  <!-- ===== ANTENNA (top-left) ===== -->
  <rect class="comp" x="60" y="70" width="230" height="86" rx="6"/>
  <text class="complbl" x="76" y="96">TELESCOPIC ANTENNA</text>
  <text class="compsub" x="76" y="112">wire or brass rod, ~15&#8211;20cm</text>
  <circle class="term" cx="270" cy="132" r="5"/>
  <text class="compsub" x="76" y="140">1 wire &#8594; GPIO4</text>
  <path class="wire w-sig" d="M270 132 L270 176 L398 176 L398 316"/>
  <text class="wlbl" x="298" y="172">GPIO4 &#183; T0 (touch)</text>

  <!-- ===== QMC5883L (top-right) ===== -->
  <rect class="comp" x="670" y="70" width="230" height="118" rx="6"/>
  <text class="complbl" x="686" y="96">QMC5883L MAGNETOMETER</text>
  <text class="compsub" x="686" y="112">3-axis, I2C addr 0x0D</text>
  <circle class="term3" cx="686" cy="132" r="4.5"/><text class="compsub" x="698" y="136">VCC</text>
  <circle class="termg" cx="686" cy="150" r="4.5"/><text class="compsub" x="698" y="154">GND</text>
  <circle class="term" cx="686" cy="168" r="4.5"/><text class="compsub" x="698" y="172">SCL</text>
  <circle class="term" cx="770" cy="168" r="4.5"/><text class="compsub" x="782" y="172">SDA</text>
  <path class="wire w-3v3" d="M686 132 L644 132 L644 226 L562 226 L562 252"/>
  <path class="wire w-gnd" d="M686 150 L624 150 L624 384 L568 384"/>
  <path class="wire w-sig" d="M686 168 L604 168 L604 352 L568 352"/>
  <path class="wire w-sig" d="M770 168 L804 168 L804 300 L562 300 L562 316"/>
  <text class="wlbl" x="608" y="230">3V3</text>
  
  

  <!-- ===== BUZZER (bottom-left) ===== -->
  <rect class="comp" x="60" y="500" width="230" height="86" rx="6"/>
  <text class="complbl" x="76" y="526">PASSIVE PIEZO BUZZER</text>
  <text class="compsub" x="76" y="542">local audible alert</text>
  <circle class="term" cx="270" cy="518" r="5"/><text class="compsub" x="200" y="522" text-anchor="end">+</text>
  <circle class="termg" cx="270" cy="536" r="5"/><text class="compsub" x="200" y="540" text-anchor="end">&#8722;</text>
  <path class="wire w-sig" d="M270 518 L326 518 L326 452 L398 452 L398 348"/>
  <path class="wire w-gnd" d="M270 536 L346 536 L346 464 L398 464 L398 284"/>
  
  

  <!-- ===== LED RING (bottom-right) ===== -->
  <rect class="comp" x="670" y="500" width="230" height="102" rx="6"/>
  <text class="complbl" x="686" y="526">WS2812B LED RING (12px)</text>
  <text class="compsub" x="686" y="542">local visual alert</text>
  <circle class="term" cx="686" cy="562" r="4.5"/><text class="compsub" x="698" y="566">DIN</text>
  <circle class="term3" cx="686" cy="580" r="4.5"/><text class="compsub" x="698" y="584">VCC (3.3&#8211;5V)</text>
  <circle class="termg" cx="820" cy="580" r="4.5"/><text class="compsub" x="800" y="584" text-anchor="end">GND</text>
  <path class="wire w-sig" d="M686 562 L636 562 L636 476 L568 476 L568 380"/>
  <path class="wire w-3v3" d="M686 580 L604 580 L604 496 L562 496 L562 284 L556 284"/>
  <path class="wire w-gnd" d="M820 580 L904 580 L904 466 L568 466 L568 380"/>
  <text class="wlbl" x="596" y="472">DIN &#8594; GPIO13</text>

  <!-- Legend -->
  <g class="legend" transform="translate(400,610)">
    <rect x="-6" y="-18" width="360" height="46" rx="6" fill="#0d1520" stroke="#1c2a33"/>
    <line x1="10" y1="0" x2="40" y2="0" class="wire w-sig"/><text x="48" y="4">Signal / Data</text>
    <line x1="10" y1="18" x2="40" y2="18" class="wire w-3v3"/><text x="48" y="22">3.3V power</text>
    <line x1="180" y1="0" x2="210" y2="0" class="wire w-gnd"/><text x="218" y="4">Ground</text>
    <text x="180" y="22" fill="#5a6b78" font-size="9.5">All sensors run on 3.3V logic</text>
  </g>
</svg>