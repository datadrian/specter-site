<text x="900" y="330" class="cardTitle" text-anchor="middle" fill="#00e5ff">BACK</text>
<text x="900" y="360" class="tiny" text-anchor="middle">PIN-LABEL SIDE</text>
<path d="M840 410 C865 380 890 445 920 405 S960 420 972 385" stroke="#38515f" stroke-width="4" fill="none"/>
