<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1460" role="img" aria-label="Complete Type-C D1 Mini NodeMCU ESP32 ESP-WROOM-32 pin wiring diagram for SPECTER Node, back pin-label side facing up with USB-C at the bottom. All four header columns and every pin are shown.">
<defs><style>
.bg{fill:#070a0f}.board{fill:#0d1820;stroke:#77a0b3;stroke-width:3}.module{fill:#14232e;stroke:#38515f;stroke-width:2}.card{fill:#0c141b;stroke:#29404c;stroke-width:2}.cardTitle{font:bold 22px Arial,sans-serif;fill:#e7f4f8}.title{font:bold 34px Arial,sans-serif;fill:#edfaff}.sub{font:18px Arial,sans-serif;fill:#9db4bf}.tiny{font:14px Arial,sans-serif;fill:#8fa5af}.pin{font:bold 15px Consolas,monospace;fill:#b9ccd4}.rownum{font:13px Consolas,monospace;fill:#5d7580}.col{font:bold 13px Consolas,monospace;fill:#829ba6;letter-spacing:.08em}.body{font:17px Arial,sans-serif;fill:#c6d7dd}.mono{font:bold 16px Consolas,monospace}.note{font:bold 16px Arial,sans-serif;fill:#ffc857}.wireDrive{stroke:#00e5ff}.wireI2c{stroke:#73e6a1}.wireLed{stroke:#ff6fae}.wireBuzz{stroke:#ffc857}.wirePower{stroke:#ff9f43}.wireGround{stroke:#9fc1d1}.wire{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.junction{fill:#00e5ff;stroke:#dffcff;stroke-width:2}.res{fill:#c79d55;stroke:#ffe0a1;stroke-width:2}.usb{fill:#9cb2bc;stroke:#dcebf0;stroke-width:3}.usedRing{fill:none;stroke:#edfaff;stroke-width:2}.legend{font:15px Arial,sans-serif;fill:#abc0c9}
</style></defs>
<rect class="bg" width="1800" height="1460"/>
<text x="40" y="48" class="title" text-anchor="start">SPECTER NODE // EXACT D1 MINI32 PIN WIRING</text>
<text x="40" y="80" class="sub" text-anchor="start" fill="#00e5ff">TYPE-C D1 MINI NODEMCU ESP32 ESP-WROOM-32</text>
<text x="40" y="108" class="sub" text-anchor="start">BACK / PIN-LABEL SIDE facing you. USB-C at the bottom. This matches the supplied board photo exactly.</text>
<rect x="610" y="155" width="580" height="1030" rx="28" class="board"/>
<rect x="820" y="215" width="160" height="250" rx="8" class="module"/>
<text x="900" y="252" class="cardTitle" text-anchor="middle">LIVE MINI KIT</text>
