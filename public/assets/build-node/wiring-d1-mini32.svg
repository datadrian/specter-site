<rect x="30" y="180" width="510" height="350" rx="12" class="card"/>
<text x="55" y="218" class="cardTitle" text-anchor="start">PROXIMITY SENSOR</text>
<text x="55" y="248" class="tiny" text-anchor="start">Exact header locations</text>
<text x="55" y="292" class="mono" text-anchor="start" fill="#00e5ff">GPIO18  - right inner, row 4</text>
<text x="55" y="326" class="mono" text-anchor="start" fill="#00e5ff">GPIO4   - left outer, row 6</text>
<text x="55" y="375" class="body" text-anchor="start">GPIO18</text>
<rect x="150" y="354" width="105" height="34" rx="7" class="res"/>
<text x="203" y="377" class="mono" text-anchor="middle" fill="#070a0f">1M ohm</text>
<line x1="255" y1="371" x2="333" y2="371" class="wire wireDrive"/>
<circle cx="333" cy="371" r="9" class="junction"/>
<text x="348" y="377" class="mono" text-anchor="start" fill="#00e5ff">SENSE JUNCTION</text>
<text x="55" y="420" class="body" text-anchor="start">GPIO4 connects directly to this junction.</text>
<text x="55" y="455" class="body" text-anchor="start">Antenna connects through optional 10k ohm.</text>
<text x="55" y="495" class="note" text-anchor="start">Do not connect the sense junction to GND.</text>
<path d="M1030 550 H1220 V135 H570 V292 H540" class="wire wireDrive"/>
<path d="M670 730 H570 V326 H540" class="wire wireDrive"/>
<rect x="30" y="580" width="510" height="300" rx="12" class="card"/>
<text x="55" y="618" class="cardTitle" text-anchor="start">QMC5883L MAGNETOMETER</text>
<text x="55" y="660" class="mono" text-anchor="start" fill="#73e6a1">SCL  -&gt; GPIO22, left inner, row 3</text>
<text x="55" y="696" class="mono" text-anchor="start" fill="#73e6a1">SDA  -&gt; GPIO21, left inner, row 4</text>
<text x="55" y="745" class="body" text-anchor="start">VCC  -&gt; 3V3 shared power rail</text>
<text x="55" y="778" class="body" text-anchor="start">GND  -&gt; shared GND rail</text>
<text x="55" y="826" class="note" text-anchor="start">I2C address must be 0x0D.</text>
<path d="M770 460 H575 V660 H540" class="wire wireI2c"/>
<path d="M770 550 H590 V696 H540" class="wire wireI2c"/>
<rect x="30" y="930" width="510" height="175" rx="12" class="card"/>
<text x="55" y="970" class="cardTitle" text-anchor="start">PASSIVE BUZZER</text>
<text x="55" y="1015" class="mono" text-anchor="start" fill="#ffc857">+  -&gt; GPIO12 / TDI, left outer, row 5</text>
<text x="55" y="1055" class="body" text-anchor="start">-  -&gt; shared GND rail</text>
<path d="M670 640 H575 V1015 H540" class="wire wireBuzz"/>
<rect x="1270" y="620" width="500" height="220" rx="12" class="card"/>
<text x="1295" y="660" class="cardTitle" text-anchor="start">ADDRESSABLE LED RING</text>
<text x="1295" y="702" class="mono" text-anchor="start" fill="#ff6fae">DIN -&gt; GPIO13 / TCK, right inner, row 9</text>
<text x="1295" y="742" class="body" text-anchor="start">VCC -&gt; 3V3 shared power rail</text>
<text x="1295" y="776" class="body" text-anchor="start">GND -&gt; shared GND rail</text>
<text x="1295" y="814" class="tiny" text-anchor="start">Ring type and count are set in the Node portal.</text>
<path d="M1030 1000 H1215 V702 H1270" class="wire wireLed"/>
<rect x="180" y="1285" width="1440" height="130" rx="12" class="card"/>
<text x="210" y="1323" class="cardTitle" text-anchor="start">SHARED POWER</text>
<text x="210" y="1360" class="body" text-anchor="start">3V3: right inner, row 8 -&gt; QMC5883L VCC + LED ring VCC + optional capacitor positive</text>
<text x="210" y="1394" class="body" text-anchor="start">GND: left inner, row 7 -&gt; QMC5883L GND + LED ring GND + buzzer negative + optional capacitor negative</text>
<path d="M1030 910 V1245 H430 V1285" class="wire wirePower"/>
<path d="M770 820 V1245 H1370 V1285" class="wire wireGround"/>
<rect x="1270" y="900" width="500" height="285" rx="12" class="card"/>
<text x="1295" y="938" class="cardTitle" text-anchor="start">PIN MAP LEGEND</text>
<circle cx="1308" cy="969" r="8" fill="#00e5ff"/>
<text x="1328" y="974" class="legend" text-anchor="start">RC drive / sense</text>
<circle cx="1308" cy="999" r="8" fill="#73e6a1"/>
<text x="1328" y="1004" class="legend" text-anchor="start">Magnetometer I2C</text>
<circle cx="1308" cy="1029" r="8" fill="#ff6fae"/>
<text x="1328" y="1034" class="legend" text-anchor="start">LED data</text>
<circle cx="1308" cy="1059" r="8" fill="#ffc857"/>
<text x="1328" y="1064" class="legend" text-anchor="start">Buzzer signal</text>
<circle cx="1308" cy="1089" r="8" fill="#ff9f43"/>
<text x="1328" y="1094" class="legend" text-anchor="start">3.3V power</text>
<circle cx="1308" cy="1119" r="8" fill="#9fc1d1"/>
<text x="1328" y="1124" class="legend" text-anchor="start">Ground</text>
<text x="1295" y="1168" class="tiny" text-anchor="start" fill="#ff8a8a">Red-outlined SD/CLK/CMD pins are flash lines. Leave them unused.</text>
<text x="40" y="1445" class="tiny" text-anchor="start">Silkscreen note: this clone prints TXD at GPIO3 and RXD at GPIO1. SPECTER does not use either serial pin.</text>
</svg>